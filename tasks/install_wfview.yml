#
# wfview — Icom rig control (SDR/network/serial). Official arm64 AppImage (Tier 1);
# replaces the original Qt5 source build. The bookworm-built AppImage runs on Trixie
# (forward-compatible). Needs libfuse2.
#
# The AppImage bundles wfview's rig-definition files (*.rig) and stylesheets, but the binary
# looks for them at the absolute path /usr/share/wfview (where a .deb would install them). An
# AppImage install populates nothing there, so wfview loads zero rig definitions and refuses
# to connect ("No rig definition found for CI-V address ..."). We extract that tree out of the
# AppImage into /usr/share/wfview so rig auto-detect (IC-7300 etc.) works on a clean image.
#
- name: Install wfview (Icom rig control)
  hosts: hampi
  become: yes
  tags: wfview
  vars:
    wfview_version: "2.24"
  tasks:
    - name: Install libfuse2 (AppImage runtime)
      apt:
        name: libfuse2t64
        state: present

    - name: Create /opt/wfview
      file:
        path: /opt/wfview
        state: directory
        mode: "0755"

    - name: Download wfview AppImage (arm64)
      get_url:
        url: "https://github.com/wf-group/wfview/releases/download/v{{ wfview_version }}/wfview-linux-arm64-bookworm.AppImage"
        dest: /opt/wfview/wfview.AppImage
        mode: "0755"
      retries: 3
      delay: 10
      register: dl
      until: dl is succeeded

    - name: Install wfview's bundled rig definitions + stylesheets to /usr/share/wfview
      shell: |
        set -e
        cd /opt/wfview
        rm -rf squashfs-root
        ./wfview.AppImage --appimage-extract >/dev/null
        mkdir -p /usr/share/wfview
        cp -r squashfs-root/usr/share/wfview/. /usr/share/wfview/
        rm -rf squashfs-root
      args:
        creates: /usr/share/wfview/rigs/IC-7300.rig

    - name: wfview launcher
      copy:
        dest: /usr/bin/wfview
        mode: "0755"
        content: |
          #!/bin/sh
          exec /opt/wfview/wfview.AppImage "$@"

    - name: wfview desktop entry
      copy:
        dest: /usr/share/applications/wfview.desktop
        mode: "0644"
        content: |
          [Desktop Entry]
          Name=wfview
          Comment=Icom rig control (SDR / network / serial)
          Exec=wfview
          Terminal=false
          Type=Application
          Categories=HamRadio;
