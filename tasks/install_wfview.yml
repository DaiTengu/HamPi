# HamPi64 (github.com/DaiTengu/HamPi) — 64-bit port of HamPi for Raspberry Pi OS Trixie / Pi 5.
# Original HamPi by Dave Slotter (W3DJS); this fork maintained by KD9QHQ. GPL-3.0.
#
# wfview — Icom rig control (SDR/network/serial). Official arm64 AppImage (Tier 1);
# replaces the original Qt5 source build. The bookworm-built AppImage runs on Trixie
# (forward-compatible). Needs libfuse2.
#
- name: Install wfview (Icom rig control)
  hosts: hampi
  become: yes
  tags: wfview
  vars:
    wfview_version: "2.24"
  tasks:
    - name: Install libfuse2 (AppImage runtime)
      apt:
        name: libfuse2t64
        state: present

    - name: Create /opt/wfview
      file:
        path: /opt/wfview
        state: directory
        mode: "0755"

    - name: Download wfview AppImage (arm64)
      get_url:
        url: "https://github.com/wf-group/wfview/releases/download/v{{ wfview_version }}/wfview-linux-arm64-bookworm.AppImage"
        dest: /opt/wfview/wfview.AppImage
        mode: "0755"
      retries: 3
      delay: 10
      register: dl
      until: dl is succeeded

    - name: wfview launcher
      copy:
        dest: /usr/bin/wfview
        mode: "0755"
        content: |
          #!/bin/sh
          exec /opt/wfview/wfview.AppImage "$@"

    - name: wfview desktop entry
      copy:
        dest: /usr/share/applications/wfview.desktop
        mode: "0644"
        content: |
          [Desktop Entry]
          Name=wfview
          Comment=Icom rig control (SDR / network / serial)
          Exec=wfview
          Terminal=false
          Type=Application
          Categories=HamRadio;
