#
# 10-10 QSO Logger (N7YG) — Java logger for the 10-10 International net. Arch-independent JAR
# run under Trixie's default-jre; ships a bundled native SQLite driver that works on arm64.
#
- name: Install Ten-Ten QSO Logger
  hosts: hampi
  become: yes
  tags: tentenqsologger
  tasks:
    - name: Install prerequisites
      apt:
        state: present
        name: [default-jre, unzip]

    - name: Create /opt/1010qsologger
      file:
        path: /opt/1010qsologger
        state: directory
        mode: "0755"

    - name: Unpack 10qsolog into /opt/1010qsologger
      unarchive:
        src: "https://n7yg.net/files/10qsolog.zip"
        dest: /opt/1010qsologger
        remote_src: yes
        creates: /opt/1010qsologger/10qsolog.sh
      register: dl
      retries: 3
      delay: 10
      until: dl is succeeded

    - name: Drop Windows cruft, make launcher executable
      shell: |
        cd /opt/1010qsologger
        rm -f 10QSOLogger.exe 10qsolog.bat
        chmod +x 10qsolog.sh

    - name: System launcher
      copy:
        dest: /usr/local/bin/tentenqsologger
        mode: "0755"
        content: |
          #!/bin/sh
          cd /opt/1010qsologger && exec ./10qsolog.sh "$@"

    - name: Desktop entry
      copy:
        dest: /usr/share/applications/tentenqsologger.desktop
        mode: "0644"
        content: |
          [Desktop Entry]
          Name=Ten-Ten QSO Logger
          Comment=10-10 International net logger
          Exec=tentenqsologger
          Terminal=false
          Type=Application
          Categories=HamRadio;
