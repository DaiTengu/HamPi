# HamPi64 (github.com/DaiTengu/HamPi) — 64-bit port of HamPi for Raspberry Pi OS Trixie / Pi 5.
# Original HamPi by Dave Slotter (W3DJS); this fork maintained by KD9QHQ. GPL-3.0.
#
# Full system upgrade + cleanup (Trixie apt).
#
- name: Upgrade all packages to the latest version
  hosts: hampi
  become: yes
  tags: upgrade
  tasks:
    - name: apt full-upgrade (dist)
      apt:
        update_cache: yes
        upgrade: dist
      retries: 5
      delay: 30
      register: r
      until: r is succeeded

    - name: Autoremove unneeded packages
      apt:
        autoremove: yes

    - name: Clean the apt cache
      apt:
        autoclean: yes
