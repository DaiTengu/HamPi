#
# leansdr (pabr) — lightweight SDR toolkit; the leandvb DVB-S/S2 demodulator + tools used for
# amateur DATV reception. The original HamPi marked it "SKIP FOR NOW". Header-only C++ core,
# builds with a plain `make` in src/apps against system FFTW; no Qt. Builds clean on aarch64.
#
- name: Install leansdr (leandvb DVB-S tools)
  hosts: hampi
  become: yes
  tags: leansdr
  tasks:
    - name: Install build dependencies
      apt:
        state: present
        name:
          - git
          - build-essential
          - libfftw3-dev

    - name: Clone leansdr (pabr)
      git:
        repo: https://github.com/pabr/leansdr.git
        dest: /usr/local/src/leansdr
        depth: 1

    - name: Build + install leansdr apps
      shell: |
        set -e
        cd /usr/local/src/leansdr/src/apps
        make
        for b in leandvb leandvbtx leansdrscan leansdrserv leantsgen leansdrcat leanchansim leanmlmrx; do
          [ -x "$b" ] && install -m 0755 "$b" /usr/local/bin/ || true
        done
      args:
        creates: /usr/local/bin/leandvb
