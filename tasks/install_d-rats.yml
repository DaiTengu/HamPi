#
# D-Rats (maurizioandreotti / ham-radio-software fork) — D-STAR (and generic) data terminal:
# chat, file transfer, forms, maps. Pure Python 3 / GTK3 (PyGObject); all deps are in Trixie
# apt (no Qt, no compiled bits of our own). Run from the checkout via a launcher.
#
- name: Install D-Rats (D-STAR data terminal)
  hosts: hampi
  become: yes
  tags: d_rats
  tasks:
    - name: Install runtime dependencies (GTK3 + python libs, all apt)
      apt:
        state: present
        name:
          - git
          - libcairo2-dev
          - libgirepository1.0-dev
          - python3-gi
          - python3-gi-cairo
          - gir1.2-gtk-3.0
          - python3-pil
          - python3-pyaudio
          - python3-lxml
          - python3-serial
          - python3-geopy
          - python3-feedparser
          - python3-pycountry
          - python3-flask
          - python3-gevent
          - python3-greenlet

    - name: Install pydub + audioop-lts (not packaged; audioop was dropped from Python 3.13)
      pip:
        name:
          - pydub
          - audioop-lts
        extra_args: --break-system-packages

    - name: Clone D-Rats (ham-radio-software fork)
      git:
        repo: https://github.com/ham-radio-software/D-Rats.git
        dest: /opt/D-Rats
        depth: 1

    - name: Make D-Rats writable in-tree (it writes a version cache at launch; username-agnostic)
      file:
        path: /opt/D-Rats
        mode: "a+rwX"
        recurse: yes
      # ponytail: world-writable /opt/D-Rats keeps the in-tree version-cache write working for
      # whatever username the image owner creates at first boot. Cleaner fix to verify at the
      # release milestone: pre-generate d_rats/setup_version.py at build so no runtime write is
      # needed, then keep the tree root-owned.

    - name: D-Rats launcher
      copy:
        dest: /usr/local/bin/d-rats
        mode: "0755"
        content: |
          #!/bin/sh
          cd /opt/D-Rats
          [ -f d-rats ] && exec python3 ./d-rats "$@"
          exec python3 ./d-rats.py "$@"

    - name: D-Rats desktop entry
      copy:
        dest: /usr/share/applications/d-rats.desktop
        mode: "0644"
        content: |
          [Desktop Entry]
          Name=D-Rats
          Comment=D-STAR / generic data terminal (chat, files, forms, maps)
          Exec=d-rats
          Terminal=false
          Type=Application
          Categories=HamRadio;
