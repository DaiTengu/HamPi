# HamPi64 (github.com/DaiTengu/HamPi) — 64-bit port of HamPi for Raspberry Pi OS Trixie / Pi 5.
# Original HamPi by Dave Slotter (W3DJS); this fork maintained by KD9QHQ. GPL-3.0.
#
# Ham licence exam / training study tools (Trixie apt, arm64).
#
- name: Install exam / training tools
  hosts: hampi
  become: yes
  tags: exam
  tasks:
    - name: apt-install exam study tools
      apt:
        update_cache: yes
        state: present
        name:
          - fccexam       # US FCC commercial radio licence exam study
          - hamexam       # US amateur radio licence exam study
