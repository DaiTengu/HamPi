#
# SKCCLogger (K7MJG) — Straight Key Century Club logger. Official native arm64 .deb; it is an
# Electron-style app that drives Chromium, so the .deb pulls chromium as a dependency.
#
- name: Install SKCCLogger
  hosts: hampi
  become: yes
  tags: skcclogger
  vars:
    skcclogger_version: "v1.1.3"
  tasks:
    - name: Download SKCCLogger arm64 .deb
      get_url:
        url: "https://github.com/K7MJG/SKCCLogger-releases/releases/download/{{ skcclogger_version }}/skcclogger-linux-arm64-{{ skcclogger_version }}.deb"
        dest: /tmp/skcclogger.deb
        mode: "0644"
      retries: 3
      delay: 10
      register: dl
      until: dl is succeeded

    - name: Install SKCCLogger (resolves chromium dep)
      apt:
        deb: /tmp/skcclogger.deb
        state: present
