#
# Go toolchain — used to build several Go ham apps (adifmt, callrec). Trixie packages a current
# Go, so no manual tarball needed.
#
- name: Install Go toolchain
  hosts: hampi
  become: yes
  tags: golang
  tasks:
    - name: Install golang-go
      apt:
        name: golang-go
        state: present
