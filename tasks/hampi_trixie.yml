# HamPi64 (github.com/DaiTengu/HamPi) — 64-bit port of HamPi for Raspberry Pi OS Trixie / Pi 5.
# Original HamPi by Dave Slotter (W3DJS); this fork maintained by KD9QHQ. GPL-3.0.
#
# HamPi Trixie / Pi 5 — Milestone 1 master playbook.
# Run from a controller: ansible-playbook -i inventory/hampi.ini tasks/hampi_trixie.yml
# (or use the ./run_trixie wrapper).
#
- import_playbook: ../library/set_facts.yml

#
# Base configuration + full system upgrade
#
- import_playbook: configuration_tasks.yml
- import_playbook: upgrade_debian_packages.yml

#
# Desktop integration + branding
#
- import_playbook: install_menus.yml
- import_playbook: install_wallpaper.yml
- import_playbook: install_about.yml

- import_playbook: core_apt_apps.yml
- import_playbook: install_wsjtx.yml
- import_playbook: install_gridtracker.yml
- import_playbook: install_pat.yml

#
# Milestone 2 — SDR drivers/tools, antenna modeling, SDRplay RSP
#
- import_playbook: install_sdr_drivers.yml
- import_playbook: install_antenna_modeling.yml
- import_playbook: install_sdrplay.yml

#
# DMR programming tools
#
- import_playbook: install_dmr_apps.yml

#
# Morse/CW + additional logging
#
- import_playbook: install_morse.yml
- import_playbook: install_logging_extras.yml

#
# Weather / satellite imaging
#
- import_playbook: install_weather.yml

#
# APRS extras, exam/training, misc utilities
#
- import_playbook: install_aprs_extras.yml
- import_playbook: install_exam.yml
- import_playbook: install_misc.yml
- import_playbook: install_more_apt_apps.yml
