# Fl_MoxGen (KB1OIQ/W1HKJ) — Moxon-antenna dimension generator. FLTK + libharu (PDF export).
# Builds clean on aarch64 with Trixie's header locations; no patches.
#
- name: Install Fl_MoxGen (Moxon antenna generator)
  hosts: hampi
  become: yes
  tags: flmoxgen
  tasks:
    - name: Install build dependencies
      apt:
        state: present
        name: [build-essential, libfltk1.3-dev, libhpdf-dev]

    - name: Build + install Fl_MoxGen
      shell: |
        set -e
        mkdir -p /usr/local/src/flmoxgen && cd /usr/local/src/flmoxgen
        curl -fsSL https://downloads.sourceforge.net/project/flmoxgen/Fl_MoxGen-1.00.tar.gz | tar xz
        cd Fl_MoxGen-1.00
        # GCC 14: getcwd needs unistd.h and implicit-decl is now a hard error, so add it.
        grep -ql unistd.h write_pdf.c || sed -i '1i #include <unistd.h>' write_pdf.c
        make
        make install
      args:
        creates: /usr/local/bin/fl_moxgen
