#
# lysdr (gordonjcp) — minimal JACK-based software-defined radio (GTK2). Original marked it
# "SKIP FOR NOW". Autotools; GCC 14 may need -fpermissive for the old C.
#
- name: Install lysdr (JACK SDR)
  hosts: hampi
  become: yes
  tags: lysdr
  tasks:
    - name: Install build dependencies
      apt:
        state: present
        name: [git, autoconf, automake, libtool, pkg-config, libgtk2.0-dev, libjack-jackd2-dev, libfftw3-dev]

    - name: Clone lysdr (gordonjcp)
      git:
        repo: https://github.com/gordonjcp/lysdr.git
        dest: /usr/local/src/lysdr
        depth: 1

    - name: Build + install lysdr
      shell: |
        set -e
        cd /usr/local/src/lysdr
        autoreconf -i
        ./configure --prefix=/usr/local
        make || make CC="cc -fpermissive"
        make install
      args:
        creates: /usr/local/bin/lysdr
