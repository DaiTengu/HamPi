#
# SoapyAirspyHF (pothosware) — SoapySDR driver module for Airspy HF+ / Discovery. Original
# removed it as "Build broken under Bookworm"; builds clean from source on Trixie/aarch64.
#
- name: Install SoapyAirspyHF module (removed as too-hard in original HamPi)
  hosts: hampi
  become: yes
  tags: soapy_airspyhf
  tasks:
    - name: Install build dependencies
      apt:
        state: present
        name: [git, cmake, g++, pkg-config, libsoapysdr-dev, libairspyhf-dev]

    - name: Clone SoapyAirspyHF
      git:
        repo: https://github.com/pothosware/SoapyAirspyHF.git
        dest: /usr/local/src/SoapyAirspyHF
        depth: 1

    - name: Build + install SoapyAirspyHF
      shell: |
        set -e
        cd /usr/local/src/SoapyAirspyHF
        rm -rf build && mkdir build && cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..
        make -j"$(nproc)"
        make install
        ldconfig
        touch /usr/local/src/SoapyAirspyHF/.hampi-built
      args:
        creates: /usr/local/src/SoapyAirspyHF/.hampi-built
