# HamPi64 (github.com/DaiTengu/HamPi) — 64-bit port of HamPi for Raspberry Pi OS Trixie / Pi 5.
# Original HamPi by Dave Slotter (W3DJS); this fork maintained by KD9QHQ. GPL-3.0.
#
# Additional APRS tools (Trixie apt, arm64), on top of Xastir + Direwolf (M1).
# YAAC (Java) is a download, not apt — deferred to the source/download group.
#
- name: Install additional APRS tools
  hosts: hampi
  become: yes
  tags: aprs_extras
  tasks:
    - name: apt-install APRS extras
      apt:
        update_cache: yes
        state: present
        name:
          - aprsdigi      # APRS digipeater
          - aprx          # APRS digipeater / iGate
          - soundmodem    # soundcard packet-radio modem
