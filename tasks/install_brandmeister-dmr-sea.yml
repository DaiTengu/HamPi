#
# brandmeister-dmr-sea (redfast00) — helper scripts/config for connecting to the BrandMeister
# DMR network. Laid down at /opt; operator-configured. No build step.
#
- name: Install brandmeister-dmr-sea
  hosts: hampi
  become: yes
  tags: brandmeister
  tasks:
    - name: Ensure git present
      apt:
        name: git
        state: present

    - name: Clone brandmeister-dmr-sea (top-level only)
      git:
        repo: https://github.com/redfast00/brandmeister-dmr-sea.git
        dest: /opt/brandmeister-dmr-sea
        depth: 1
        recursive: no      # the md380tools submodule uses an SSH URL (no auth on the Pi) and
                           # isn't needed for the connect helper scripts
