#
# HamRS — closed-source freeware logger (Electron AppImage). DEFERRED non-free: NOT baked
# into the image (this play ends unless include_nonfree=true). On the image it is installed
# on demand by the "HamPi64 Extras" launcher via files/nonfree/hamrs.sh; this play runs that
# same shared script when a maintainer bakes with `-e include_nonfree=true`. Single source of
# truth, no ansible needed on the Pi. HamPi64 does not redistribute HamRS.
#
- name: Install HamRS (deferred non-free)
  hosts: hampi
  become: yes
  tags: hamrs
  tasks:
    - name: Deferred non-free — skip unless include_nonfree=true
      meta: end_play
      when: not (include_nonfree | default(false) | bool)

    - name: Install HamRS via the shared installer (files/nonfree/hamrs.sh)
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/../files/nonfree/hamrs.sh"
        creates: /usr/local/bin/hamrs
