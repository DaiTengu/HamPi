# Reverse Beacon Network client (hmatuschek/skcc) — Qt5 CW skimmer/RBN spotting client.
# CMake build against Qt5; builds on aarch64.
#
- name: Install Reverse Beacon Network client
  hosts: hampi
  become: yes
  tags: reverse_beacon
  tasks:
    - name: Install build dependencies
      apt:
        state: present
        # qttools5-dev supplies the Qt5LinguistTools CMake package (clean-build catch — the dev
        # Pi had it via WSJT-Z's deps).
        name: [git, cmake, g++, qtbase5-dev, qtmultimedia5-dev, qttools5-dev, libfftw3-dev, libpulse-dev]

    - name: Clone RBN client (hmatuschek/skcc)
      git:
        repo: https://github.com/hmatuschek/skcc.git
        dest: /usr/local/src/rbnc-skcc
        depth: 1

    - name: Build + install RBN client
      shell: |
        set -e
        cd /usr/local/src/rbnc-skcc
        rm -rf build && mkdir build && cd build
        cmake -Wno-dev -DCMAKE_INSTALL_PREFIX=/usr/local ..
        make -j"$(nproc)"
        make install
        touch /usr/local/src/rbnc-skcc/.hampi-built
      args:
        creates: /usr/local/src/rbnc-skcc/.hampi-built
