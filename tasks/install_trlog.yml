#
# TR4W/TR-Linux (trlinux, N6TR) — contest logger. Original HamPi marked it BROKEN and went to
# great lengths to install a specific FPC 3.2.2 via an expect script; Trixie already ships FPC
# 3.2.2, so we build straight against the system compiler — no custom toolchain needed.
#
- name: Install TR-Linux contest logger (removed as BROKEN in original HamPi)
  hosts: hampi
  become: yes
  tags: trlog
  tasks:
    - name: Install build dependencies
      apt:
        state: present
        name: [git, fpc, make, build-essential, libhidapi-dev, libcurl4-openssl-dev, libieee1284-3-dev]

    - name: Clone trlinux (N6TR)
      git:
        repo: https://github.com/trlinux/trlinux.git
        dest: /usr/local/src/trlinux
        depth: 1

    - name: Build + install trlog (src/ target only — skips the doc/ pdflatex build)
      shell: |
        set -e
        cd /usr/local/src/trlinux/src
        make trlog
        install -m 0755 trlog /usr/local/bin/trlog
      args:
        creates: /usr/local/bin/trlog
