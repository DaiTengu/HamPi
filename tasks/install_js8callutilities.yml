#
# JS8Call Utilities V2 (M0IAX) — companion Python tools for JS8Call (APRS, telemetry, etc.).
# Pure Python; cloned to /opt and exposed via a launcher.
#
- name: Install JS8Call Utilities
  hosts: hampi
  become: yes
  tags: js8callutilities
  tasks:
    - name: Install dependencies
      apt:
        state: present
        name: [git, python3, python3-serial]

    - name: Install python libs not in apt (system-wide)
      pip:
        name: [maidenhead, gps, configparser]
        extra_args: --break-system-packages

    - name: Clone JS8CallUtilities_V2 (M0IAX)
      git:
        repo: https://github.com/m0iax/JS8CallUtilities_V2.git
        dest: /opt/JS8CallUtilities_V2
        depth: 1

    - name: Launcher
      copy:
        dest: /usr/local/bin/js8callutilities
        mode: "0755"
        content: |
          #!/bin/sh
          cd /opt/JS8CallUtilities_V2
          main=$(ls JS8*.py 2>/dev/null | head -1)
          exec python3 "./$main" "$@"
