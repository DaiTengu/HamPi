#
# acarsdec (TLeconte) — ACARS (aircraft datalink) decoder for RTL-SDR / Airspy / SoapySDR.
# Not in Trixie apt, so built from source. libacars isn't packaged either, so we build that
# first (it gives acarsdec full message decoding rather than raw frames). Both are small
# CMake C builds. acarsdec upstream is archived but stable; builds clean on aarch64.
#
- name: Install acarsdec (ACARS decoder)
  hosts: hampi
  become: yes
  tags: acarsdec
  tasks:
    - name: Install build dependencies
      apt:
        state: present
        name:
          - git
          - cmake
          - build-essential
          - pkg-config
          - librtlsdr-dev
          - libairspy-dev
          - libsoapysdr-dev
          - zlib1g-dev
          - libxml2-dev
          - libjansson-dev
          - libsqlite3-dev

    - name: Clone libacars (szpajder)
      git:
        repo: https://github.com/szpajder/libacars.git
        dest: /usr/local/src/libacars
        depth: 1

    - name: Build + install libacars
      shell: |
        set -e
        cd /usr/local/src/libacars
        rm -rf build && mkdir build && cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..
        make -j"$(nproc)"
        make install
        ldconfig
      args:
        creates: /usr/local/lib/pkgconfig/libacars-2.pc

    - name: Clone acarsdec (TLeconte), pinned to the last release (master is a broken WIP)
      git:
        repo: https://github.com/TLeconte/acarsdec.git
        dest: /usr/local/src/acarsdec
        version: acarsdec-3.7
        depth: 1
        force: yes

    - name: Build + install acarsdec (RTL-SDR backend, with libacars)
      shell: |
        set -e
        cd /usr/local/src/acarsdec
        rm -rf build && mkdir build && cd build
        # acarsdec builds for ONE SDR backend at a time — enabling several at once collides
        # (duplicate globals / case labels). RTL-SDR is the usual ACARS receiver; rebuild with
        # -Dairspy=ON instead of -Drtl=ON if you use an Airspy.
        PKG_CONFIG_PATH=/usr/local/lib/pkgconfig cmake -Drtl=ON ..
        make -j"$(nproc)"
        install -m 0755 acarsdec /usr/local/bin/acarsdec
      args:
        creates: /usr/local/bin/acarsdec
