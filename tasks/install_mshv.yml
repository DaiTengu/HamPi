#
# MSHV (LZ2HV) — multi-mode weak-signal app (MSK144/FT8/JT65 etc.). Qt5 + gfortran. The .pro is
# labelled _I686 but qmake retargets to aarch64; built from the SourceForge full-source zip.
#
- name: Install MSHV (weak-signal)
  hosts: hampi
  become: yes
  tags: mshv
  tasks:
    - name: Install build dependencies
      apt:
        state: present
        # MSHV's .pro requires the Qt5 WebSockets module (libqt5websockets5-dev). Clean-build
        # catch: the dev Pi only had it because WSJT-Z's deps had pulled it in.
        name: [curl, unzip, build-essential, gfortran, qtbase5-dev, qtmultimedia5-dev, libqt5websockets5-dev, libfftw3-dev, libgomp1]

    - name: Download, build + install MSHV
      shell: |
        set -e
        mkdir -p /usr/local/src/mshv && cd /usr/local/src/mshv
        curl -fsSL -o mshv.zip "https://sourceforge.net/projects/mshv/files/MSHV_2766_Full_Source_Code.zip/download"
        unzip -oq mshv.zip
        cd "$(find . -maxdepth 1 -type d -iname 'MSHV*' | head -1)"
        pro=$(ls *.pro 2>/dev/null | grep -viE 'win|mac' | head -1)
        qmake "$pro"
        make -j"$(nproc)"
        bin=$(find . -maxdepth 2 -type f -executable -iname 'mshv*' | head -1)
        install -m 0755 "$bin" /usr/local/bin/mshv
      args:
        creates: /usr/local/bin/mshv
