#
# DXSpider — DX-cluster node software (Perl). No Debian package; installed to /spider under a
# dedicated `sysop` user, from the latchdevel GitHub mirror. Running a live node is left to the
# operator (edit /spider/local, start cluster.pl) — this just lays the software down.
#
- name: Install DXSpider (DX cluster node)
  hosts: hampi
  become: yes
  tags: dxspider
  tasks:
    - name: Install Perl dependencies
      apt:
        state: present
        name: [git, perl, libtimedate-perl, libnet-telnet-perl, libcurses-perl, libdigest-sha-perl, libmojolicious-perl]

    - name: Create sysop system user
      user:
        name: sysop
        system: yes
        home: /spider
        create_home: no
        shell: /bin/bash

    - name: Clone DXSpider (latchdevel mirror)
      git:
        repo: https://github.com/latchdevel/DXspider.git
        dest: /spider
        depth: 1

    - name: Own + permission /spider for sysop
      shell: |
        set -e
        chown -R sysop:sysop /spider
        find /spider -type d -exec chmod 2775 {} +
        find /spider -type f -exec chmod 775 {} +
        touch /spider/.hampi-perms
      args:
        creates: /spider/.hampi-perms
