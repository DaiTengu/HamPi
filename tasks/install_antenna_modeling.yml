#
# Antenna modeling / RF analysis tools (Trixie apt, arm64).
# Note: xnecview, antennavis, gsmc were dropped from Trixie; xnec2c covers
# the modeling + gain-pattern visualization those provided.
#
- name: Install antenna modeling tools
  hosts: hampi
  become: yes
  tags: antenna
  tasks:
    - name: apt-install antenna modeling packages
      apt:
        update_cache: yes
        state: present
        name:
          - nec2c        # NEC2 method-of-moments engine (C port)
          - xnec2c       # NEC2 GUI: geometry + gain patterns
          - yagiuda      # Yagi-Uda array analysis
          - splat        # point-to-point RF path / coverage analysis
