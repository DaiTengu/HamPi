#
# DroidStar (nostar) — digital-voice hotspot client (D-STAR/DMR/YSF/P25/NXDN/M17). The app is
# GPL, but its voice modes use the patent-encumbered AMBE vocoder (firmware extracted from a
# TYT MD-380). DEFERRED non-free: NOT baked into the image (this play ends unless
# include_nonfree=true). On the image it is installed on demand by the "HamPi64 Extras"
# launcher via files/nonfree/droidstar.sh (which does the Qt6 + md380-vocoder build); this
# play runs that same shared script when a maintainer bakes with `-e include_nonfree=true`.
# HamPi64 does not redistribute the vocoder.
#
- name: Install DroidStar (deferred non-free)
  hosts: hampi
  become: yes
  tags: droidstar
  tasks:
    - name: Deferred non-free — skip unless include_nonfree=true
      meta: end_play
      when: not (include_nonfree | default(false) | bool)

    - name: Install DroidStar + md380 vocoder via the shared installer (files/nonfree/droidstar.sh)
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/../files/nonfree/droidstar.sh"
        creates: /usr/local/bin/DroidStar
