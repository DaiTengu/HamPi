# HamPi64 (github.com/DaiTengu/HamPi) — 64-bit port of HamPi for Raspberry Pi OS Trixie / Pi 5.
# Original HamPi by Dave Slotter (W3DJS); this fork maintained by KD9QHQ. GPL-3.0.
#
# Base image configuration (Trixie / Pi 5), trimmed from the original.
#
# Dropped vs. original (deliberately):
#  - rpi-update + arm_64bit=1  — moot AND dangerous on an already-64-bit Pi 5
#  - hostname                  — set by the user / rpi-imager, not baked in
#  - LXDE-pi / lightdm / pcmanfm / raspi-ui-overrides desktop config — Bullseye-era;
#    Trixie is labwc/Wayland (handled, where possible, by the branding tasks)
#  - .bash_local build flags + QRZ credentials — dev/station config, not image config
#
# Station config (callsign, radios, hostname, credentials) is done by the END USER
# on the Pi after flashing.
#
- name: Base configuration
  hosts: hampi
  become: yes
  tags: config
  tasks:
    - name: Passwordless sudo for the ham user (appliance convenience)
      copy:
        dest: "/etc/sudoers.d/010_{{ ham_user }}-nopasswd"
        content: "{{ ham_user }} ALL=(ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"

    - name: Add ham user to dialout + plugdev (serial CAT + USB SDR access)
      user:
        name: "{{ ham_user }}"
        groups: dialout,plugdev
        append: yes

    - name: Install unattended-upgrades + powermgmt-base
      apt:
        state: present
        name:
          - unattended-upgrades
          - powermgmt-base
