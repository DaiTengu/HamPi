# Copyright (C) 2020-2024 Dave Slotter, W3DJS (original HamPi); (C) 2026 HamPi64 contributors.
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Base image configuration (Trixie / Pi 5), trimmed from the original.
#
# Dropped vs. original (deliberately):
#  - rpi-update + arm_64bit=1  — moot AND dangerous on an already-64-bit Pi 5
#  - hostname                  — set by the user / rpi-imager, not baked in
#  - LXDE-pi / lightdm / pcmanfm / raspi-ui-overrides desktop config — Bullseye-era;
#    Trixie is labwc/Wayland (handled, where possible, by the branding tasks)
#  - .bash_local build flags + QRZ credentials — dev/station config, not image config
#
# Station config (callsign, radios, hostname, credentials) is done by the END USER
# on the Pi after flashing.
#
- name: Base configuration
  hosts: hampi
  become: yes
  tags: config
  tasks:
    - name: Passwordless sudo for the admin (sudo group) — appliance convenience, username-agnostic
      copy:
        dest: /etc/sudoers.d/010_hampi64-nopasswd
        content: "%sudo ALL=(ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"

    - name: Add ham user to dialout + plugdev (serial CAT + USB SDR access)
      user:
        name: "{{ ham_user }}"
        groups: dialout,plugdev
        append: yes

    - name: Install unattended-upgrades + powermgmt-base
      apt:
        state: present
        name:
          - unattended-upgrades
          - powermgmt-base

    # Source-built Qt apps installed under /usr/local (hamfax, mshv, sdrangel, DroidStar,
    # rbnc, linpsk, …) don't inherit Debian's baked Qt plugin path, so they fail at launch
    # with: qt.qpa.plugin: Could not find the Qt platform plugin "xcb". Set QT_PLUGIN_PATH
    # session-wide via /etc/environment (loaded by PAM for console + graphical logins) to
    # point at both the Qt5 and Qt6 system plugin trees; each app ignores the wrong-version
    # entries. Verified: a fresh login inherits it and the apps then initialize.
    - name: Set QT_PLUGIN_PATH for source-built Qt apps (fixes "xcb plugin not found")
      lineinfile:
        path: /etc/environment
        regexp: '^QT_PLUGIN_PATH='
        line: "QT_PLUGIN_PATH=/usr/lib/aarch64-linux-gnu/qt5/plugins:/usr/lib/aarch64-linux-gnu/qt6/plugins"
