#
# adifmerg (oh7bf) — command-line ADIF log merge / convert / check tool (plus the qsorep
# reporting script). Self-contained Perl; the repo's own ./install copies the scripts + man
# pages system-wide. Built from a neutral /usr/local/src checkout so nothing lands in a user's
# home (the image has no user until first boot).
#
- name: Install adifmerg Software
  hosts: hampi
  become: yes
  gather_facts: no
  tasks:
    - name: Install dependent library (readline for qsorep)
      package:
        name: libterm-readline-gnu-perl
        state: present
      retries: 5
      delay: 30
      register: result
      until: result.failed == false

    - name: Git clone latest adifmerg sources
      git:
        repo: https://github.com/oh7bf/adifmerg.git
        dest: /usr/local/src/adifmerg
      retries: 5
      delay: 30
      register: result
      until: result.failed == false

    - name: Install adifmerg (its ./install copies scripts + man pages system-wide)
      command: ./install
      args:
        chdir: /usr/local/src/adifmerg

    - name: Remove adifmerg build directory
      file:
        path: /usr/local/src/adifmerg
        state: absent
