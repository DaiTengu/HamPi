#
# OpenDV (dl5di) — D-STAR suite. Original removed it as "Build broken under Bookworm". Building
# the DStarRepeater component (wxWidgets autotools) as the representative install.
#
- name: Install OpenDV (DStarRepeater component)
  hosts: hampi
  become: yes
  tags: opendv
  tasks:
    - name: Install build dependencies
      apt:
        state: present
        name: [git, build-essential, autoconf, automake, pkg-config, libwxgtk3.2-dev, libusb-1.0-0-dev]

    - name: Clone OpenDV (dl5di)
      git:
        repo: https://github.com/dl5di/OpenDV.git
        dest: /usr/local/src/OpenDV
        depth: 1

    - name: Build + install DStarRepeater
      shell: |
        set -e
        cd /usr/local/src/OpenDV/DStarRepeater
        [ -x ./configure ] || autoreconf -fi
        ./configure --prefix=/usr/local
        make -j"$(nproc)" || make CXX="g++ -fpermissive" -j"$(nproc)"
        make install
      args:
        creates: /usr/local/bin/dstarrepeater
