#
# AMBEserver (NW Digital Radio) — exposes a DV3000/ThumbDV AMBE dongle over TCP. The install
# tree is laid down at /opt; the operator runs the bundled installer once a DV3000 is attached
# (it needs the hardware to do anything).
#
- name: Install AMBEserver (NW Digital Radio)
  hosts: hampi
  become: yes
  tags: ambeserver
  tasks:
    - name: Ensure git present
      apt:
        name: git
        state: present

    - name: Clone AMBEserver install tree
      git:
        repo: https://github.com/nwdigitalradio/ambeserver-install.git
        dest: /opt/ambeserver-install
        depth: 1
