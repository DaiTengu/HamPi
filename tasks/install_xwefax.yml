# xwefax (5B4AZ) — WEFAX / radio-fax decoder with GTK3 UI + Hamlib rig control. Not packaged;
# built from the radiocatalog mirror. Autotools + GTK3 + ALSA; builds on aarch64.
#
- name: Install xwefax (weather fax)
  hosts: hampi
  become: yes
  tags: xwefax
  tasks:
    - name: Install build dependencies
      apt:
        state: present
        name: [git, build-essential, autoconf, automake, pkg-config, libgtk-3-dev, libasound2-dev, libhamlib-dev]

    - name: Clone xwefax (radiocatalog mirror)
      git:
        repo: https://github.com/radiocatalog/xwefax.git
        dest: /usr/local/src/xwefax
        depth: 1

    - name: Build + install xwefax
      shell: |
        set -e
        cd /usr/local/src/xwefax
        [ -x ./configure ] || autoreconf -fi
        ./configure --prefix=/usr/local
        make -j"$(nproc)"
        make install
        # xwefax derives its data-dir (Glade file) from argv[0]; launched bare via PATH that
        # fails, so wrap it to run with an absolute argv[0].
        mv -f /usr/local/bin/xwefax /usr/local/bin/xwefax.bin
        printf '#!/bin/sh\nexec /usr/local/bin/xwefax.bin "$@"\n' > /usr/local/bin/xwefax
        chmod 0755 /usr/local/bin/xwefax
      args:
        creates: /usr/local/bin/xwefax.bin
