#
# Apps the ORIGINAL HamPi removed as unbuildable ("Build broken under Bookworm" / "Website
# gone") that Trixie now packages for arm64 — recovered as plain apt installs:
#   freedv   — FreeDV digital-voice (was "Build broken under Bookworm")
#   twclock  — ham clock + CW keyer timing (was "Website gone")
#
- name: Install recovered apt apps (removed in original HamPi)
  hosts: hampi
  become: yes
  tags: recovered_apt
  tasks:
    - name: Install recovered apps from Trixie apt
      apt:
        state: present
        name:
          - freedv
          - twclock
