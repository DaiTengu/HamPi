#
# UHRR — Universal HamRadio Remote (F4HTB): browser-based rig remote-control + audio over a
# Tornado web server. Pure Python; apt provides tornado/numpy/alsaaudio/pyserial, pyrtlsdr via
# pip. Cloned to /opt/UHRR; it is run/configured by the operator (not auto-started as a service).
#
- name: Install UHRR (web rig remote)
  hosts: hampi
  become: yes
  tags: uhrr
  tasks:
    - name: Install dependencies
      apt:
        state: present
        name:
          - git
          - python3-tornado
          - python3-numpy
          - python3-alsaaudio
          - python3-serial
          - python3-pyaudio
          - libhamlib-utils
          - libopus0
          - swig

    - name: Install pyrtlsdr (not packaged) into a shared venv
      shell: |
        set -e
        python3 -m venv --system-site-packages /opt/uhrr-venv
        /opt/uhrr-venv/bin/pip install --quiet pyrtlsdr
        touch /opt/uhrr-venv/.hampi-built
      args:
        creates: /opt/uhrr-venv/.hampi-built

    - name: Clone UHRR (F4HTB)
      git:
        repo: https://github.com/F4HTB/Universal_HamRadio_Remote_HTML5.git
        dest: /opt/UHRR
        depth: 1

    - name: UHRR launcher (runs from its checkout, in the pyrtlsdr venv)
      copy:
        dest: /usr/local/bin/uhrr
        mode: "0755"
        content: |
          #!/bin/sh
          cd /opt/UHRR && exec /opt/uhrr-venv/bin/python3 ./UHRR "$@"
