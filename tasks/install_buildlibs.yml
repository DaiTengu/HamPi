#
# Build-support libraries the original HamPi compiled from source (custom CMake, wxWidgets
# static lib, RtAudio) — all now current in Trixie apt for arm64, so just installed as packages.
#
- name: Install build-support libraries (cmake, wxWidgets, RtAudio)
  hosts: hampi
  become: yes
  tags: buildlibs
  tasks:
    - name: Install from apt
      apt:
        state: present
        name:
          - cmake
          - libwxgtk3.2-dev
          - wx-common
          - librtaudio-dev
