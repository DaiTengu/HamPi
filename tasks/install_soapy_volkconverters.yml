#
# SoapyVOLKConverters (pothosware) — VOLK-accelerated SoapySDR type converters. The original
# removed it as "Build broken under Bookworm". Built from source against Trixie's libvolk-dev
# 3.2 (do NOT use the sid .deb — it wants libvolk3.3 which Trixie lacks).
#
- name: Install SoapyVOLKConverters (removed as too-hard in original HamPi)
  hosts: hampi
  become: yes
  tags: soapy_volkconverters
  tasks:
    - name: Install build dependencies
      apt:
        state: present
        name: [git, cmake, g++, pkg-config, libsoapysdr-dev, libvolk-dev]

    - name: Clone SoapyVOLKConverters (pinned release)
      git:
        repo: https://github.com/pothosware/SoapyVOLKConverters.git
        dest: /usr/local/src/SoapyVOLKConverters
        version: soapy-volk-converters-0.1.1
        depth: 1

    - name: Build + install SoapyVOLKConverters
      shell: |
        set -e
        cd /usr/local/src/SoapyVOLKConverters
        rm -rf build && mkdir build && cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..
        make -j"$(nproc)"
        make install
        ldconfig
        touch /usr/local/src/SoapyVOLKConverters/.hampi-built
      args:
        creates: /usr/local/src/SoapyVOLKConverters/.hampi-built
