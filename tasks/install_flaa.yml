# flaa (W1HKJ) — control program for RigExpert AA-series antenna analyzers. FLTK autotools
# build; GCC 14 builds it as-is (deprecation warnings only). Needs a RigExpert AA over USB
# to do more than show its UI, but installs/builds fine.
#
- name: Install flaa (antenna analyzer control)
  hosts: hampi
  become: yes
  tags: flaa
  tasks:
    - name: Install build dependencies
      apt:
        state: present
        name: [build-essential, autoconf, automake, libfltk1.3-dev, libx11-dev]

    - name: Build + install flaa
      shell: |
        set -e
        mkdir -p /usr/local/src/flaa && cd /usr/local/src/flaa
        curl -fsSL https://www.w1hkj.org/files/flaa/flaa-1.0.2.tar.gz | tar xz
        cd flaa-1.0.2
        ./configure
        make -j"$(nproc)"
        make install
      args:
        creates: /usr/local/bin/flaa
