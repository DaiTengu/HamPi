#
# Wordsworth (KB1OIQ/K1IG) — Morse-code trainer scripts. Arch-independent; unpacked to /opt
# and exposed via a launcher. No compilation.
#
- name: Install Wordsworth (Morse trainer)
  hosts: hampi
  become: yes
  tags: wordsworth
  tasks:
    - name: Ensure unzip present
      apt:
        name: unzip
        state: present

    - name: Create /opt/wordsworth
      file:
        path: /opt/wordsworth
        state: directory
        mode: "0755"

    - name: Download + unpack Wordsworth
      unarchive:
        src: https://sourceforge.net/projects/kb1oiq-k1ig-wordsworth/files/wordsworth/wordsworth_0.3.zip/download
        dest: /opt/wordsworth
        remote_src: yes
        validate_certs: no
        creates: /opt/wordsworth/wordsworth_0.3
      register: dl
      retries: 3
      delay: 10
      until: dl is succeeded

    - name: Decompress bundled .gz + install launcher
      shell: |
        set -e
        cd /opt/wordsworth/wordsworth_0.3
        gunzip -f *.gz 2>/dev/null || true
        chmod +x wordsworth 2>/dev/null || true
        printf '#!/bin/sh\ncd /opt/wordsworth/wordsworth_0.3 && exec ./wordsworth "$@"\n' > /usr/local/bin/wordsworth
        chmod 0755 /usr/local/bin/wordsworth
      args:
        creates: /usr/local/bin/wordsworth
