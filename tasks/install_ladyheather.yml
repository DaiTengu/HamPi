#
# Lady Heather (KE5FX/Mark Sims) — GPS-disciplined-oscillator / timing monitor. Built from the
# stargo Linux port against the X11 stack. GCC 14 needs -fpermissive for the old C++.
#
- name: Install Lady Heather (GPSDO monitor)
  hosts: hampi
  become: yes
  tags: ladyheather
  tasks:
    - name: Install build dependencies
      apt:
        state: present
        name: [git, build-essential, libx11-dev]

    - name: Clone LadyHeatherGPS (stargo Linux port)
      git:
        repo: https://github.com/stargo/LadyHeatherGPS.git
        dest: /usr/local/src/LadyHeatherGPS
        depth: 1

    - name: Build + install heather
      shell: |
        set -e
        cd /usr/local/src/LadyHeatherGPS
        make CXX='g++ -fpermissive' || make
        bin=$(find . -maxdepth 2 -type f -executable -name 'heather*' | head -1)
        install -m 0755 "$bin" /usr/local/bin/heather
      args:
        creates: /usr/local/bin/heather
