#
# DMRlink + HBlink3 (HBLink-org) — Python DMR IPSC / HBP network software. Pure Python; cloned
# to /opt with its deps in a venv. Operator configures/runs it (network + hotspot dependent).
#
- name: Install DMRlink / HBlink3
  hosts: hampi
  become: yes
  tags: dmrlink
  tasks:
    - name: Install prerequisites
      apt:
        state: present
        name: [git, python3, python3-venv]

    - name: Clone DMRlink
      git:
        repo: https://github.com/HBLink-org/DMRlink.git
        dest: /opt/DMRlink
        depth: 1

    - name: Clone hblink3
      git:
        repo: https://github.com/HBLink-org/hblink3.git
        dest: /opt/hblink3
        depth: 1

    - name: Create venv + install hblink3 requirements
      shell: |
        set -e
        python3 -m venv /opt/hblink3-venv
        /opt/hblink3-venv/bin/pip install --quiet -r /opt/hblink3/requirements.txt
        touch /opt/hblink3-venv/.hampi-built
      args:
        creates: /opt/hblink3-venv/.hampi-built
