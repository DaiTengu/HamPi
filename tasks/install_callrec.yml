#
# callrec (BrandMeister) — DMR call recorder. Go program; the original marked it BROKEN. Builds
# cleanly with Trixie's Go via `go install`, dropped into /usr/local/bin.
#
- name: Install callrec (removed as BROKEN in original HamPi)
  hosts: hampi
  become: yes
  tags: callrec
  tasks:
    - name: Install Go + git
      apt:
        state: present
        name: [golang-go, git]

    - name: Clone callrec (module path is bare "callrec", so build in-tree)
      git:
        repo: https://github.com/BrandMeister/callrec.git
        dest: /usr/local/src/callrec
        depth: 1

    - name: Build + install callrec
      shell: |
        set -e
        cd /usr/local/src/callrec
        export GOPATH=/usr/local/src/go GOCACHE=/usr/local/src/go/.cache
        go build -o /usr/local/bin/callrec .
      args:
        creates: /usr/local/bin/callrec
