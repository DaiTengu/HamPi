#
# Additional apps that a final coverage pass found available straight from Trixie apt
# (arm64) — the last easy wins from the original HamPi set.
#
- name: Install additional apt apps (final coverage pass)
  hosts: hampi
  become: yes
  tags: apt_extras
  tasks:
    - name: Install extra apt apps
      apt:
        state: present
        name:
          - airspyhf          # Airspy HF+ / Discovery SDR driver + tools
          - quisk             # SDR transceiver / panadapter application
          - linpac            # AX.25 packet-radio terminal (mailbox client)
          - flwrap            # FLDigi file-wrap/transfer utility (completes the FL suite)
          - cwdaemon          # Morse (CW) keying daemon used by loggers/contest tools
