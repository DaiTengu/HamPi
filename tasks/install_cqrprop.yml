#
# CQRPROP (OK2CQR) — HF propagation-forecast panel. Free Pascal / Lazarus (LCL-GTK2) build.
#
- name: Install CQRPROP (propagation forecast)
  hosts: hampi
  become: yes
  tags: cqrprop
  tasks:
    - name: Install build dependencies
      apt:
        state: present
        name: [git, build-essential, lazarus, fpc, fpc-source, libgtk2.0-dev, libssl-dev]

    - name: Clone cqrprop (ok2cqr)
      git:
        repo: https://github.com/ok2cqr/cqrprop.git
        dest: /usr/local/src/cqrprop
        depth: 1

    - name: Build + install cqrprop
      shell: |
        set -e
        cd /usr/local/src/cqrprop
        make
        make install
        touch /usr/local/src/cqrprop/.hampi-built
      args:
        creates: /usr/local/src/cqrprop/.hampi-built
