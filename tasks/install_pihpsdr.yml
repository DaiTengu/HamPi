#
# piHPSDR (dl1ycf) — controller for HPSDR / Hermes / Red Pitaya SDR transceivers.
# Uses the actively-maintained dl1ycf fork (the original g0orx fork is stale).
# wdsp + rnnoise + libspecbleach are bundled in-repo and built by the Makefile,
# so no separate DSP-lib clone. GPIO is front-panel buttons via libgpiod (RP1-safe).
#
- name: Install piHPSDR
  hosts: hampi
  become: yes
  tags: pihpsdr
  tasks:
    - name: Install build dependencies
      apt:
        state: present
        name:
          - git
          - build-essential
          - pkg-config
          - libgtk-3-dev
          - libusb-1.0-0-dev
          - libi2c-dev
          - libgpiod-dev
          - libfftw3-dev
          - libasound2-dev
          - libpulse-dev
          - libssl-dev
          - libcurl4-openssl-dev
          - libpcap-dev
          - libaio-dev
          - libopus-dev
          - libsqlite3-dev
          - libminiupnpc-dev
          - libwebsockets-dev
          - libavahi-client-dev
          - libxml2-dev
          - libzstd-dev
          - zlib1g-dev
          - librtlsdr-dev
          - libhackrf-dev
          - libiio-dev
          - libad9361-dev

    - name: Clone piHPSDR (dl1ycf)
      git:
        repo: https://github.com/dl1ycf/pihpsdr.git
        dest: /usr/local/src/pihpsdr
        depth: 1

    - name: Build + install piHPSDR (builds bundled wdsp/rnnoise/libspecbleach first)
      shell: |
        set -e
        cd /usr/local/src/pihpsdr
        make -j"$(nproc)"
        bin=$(find . -maxdepth 2 -name pihpsdr -type f -executable | head -1)
        install -m 0755 "$bin" /usr/bin/pihpsdr
      args:
        creates: /usr/bin/pihpsdr

    - name: piHPSDR desktop entry
      copy:
        dest: /usr/share/applications/pihpsdr.desktop
        mode: "0644"
        content: |
          [Desktop Entry]
          Name=piHPSDR
          Comment=Controller for HPSDR / Hermes / Red Pitaya SDR transceivers
          Exec=pihpsdr
          Terminal=false
          Type=Application
          Categories=HamRadio;
