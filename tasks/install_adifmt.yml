#
# adifmt (ADIF Multitool, flwyd) — CLI for filtering/converting ADIF logs. Go program; built
# with Trixie's golang toolchain via `go install`, binary dropped into /usr/local/bin.
#
- name: Install adifmt (ADIF Multitool)
  hosts: hampi
  become: yes
  tags: adifmt
  tasks:
    - name: Install Go toolchain
      apt:
        state: present
        name:
          - golang-go
          - git

    - name: Build + install adifmt via go install
      shell: |
        set -e
        export GOBIN=/usr/local/bin
        export GOPATH=/usr/local/src/go
        export GOCACHE=/usr/local/src/go/.cache
        go install github.com/flwyd/adif-multitool/adifmt@latest
      args:
        creates: /usr/local/bin/adifmt
