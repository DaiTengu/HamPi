#
# Lopora (PA2OHH) — QRSS / very-slow-CW beacon reception + keyer (Python 3 / Tkinter). It reads
# AND writes its config/fonts/maps in its own folder, so each user needs a private writable copy.
# We ship the template in /etc/skel/lopora (copied into every new user's home when their account
# is created at first boot), and the launcher self-heals an existing user's ~/lopora from that
# template — so it works on a fresh username-agnostic image and on an already-provisioned Pi.
# Trixie/Pi 5 changes from the original: python3-pillow -> python3-pil, dropped pulseaudio
# (PipeWire), points at the current v5g script, launcher + desktop entry instead of LXDE scripts.
#
- name: Install Lopora by PA2OHH
  hosts: hampi
  become: yes
  gather_facts: no
  tasks:
    - name: Install dependent libraries for Lopora
      package:
        name: "{{ item }}"
        state: present
      with_items:
        - python3
        - python3-numpy
        - python3-pil
        - python3-pil.imagetk
        - python3-pyaudio
        - pavucontrol
        - unzip
      retries: 5
      delay: 30
      register: result
      until: result.failed == false

    - name: Create the Lopora template dir in /etc/skel
      file:
        path: /etc/skel/lopora
        state: directory
        mode: "0755"

    - name: Download + unarchive Lopora into the skel template
      unarchive:
        src: https://www.qsl.net/pa2ohh/11lopsource.zip
        dest: /etc/skel/lopora
        remote_src: yes
        creates: /etc/skel/lopora/LOPORA-v5g.py
      retries: 5
      delay: 30
      register: result
      until: result.failed == false

    - name: Install lopora launcher (self-heals ~/lopora from the skel template)
      copy:
        dest: /usr/local/bin/lopora
        mode: "0755"
        content: |
          #!/bin/sh
          # Lopora reads/writes its fonts/config/maps in its own folder, so give each user a
          # private writable copy. New users get ~/lopora from /etc/skel automatically; existing
          # users (or the dev Pi) are seeded from the template here on first run.
          [ -d "$HOME/lopora" ] || cp -r /etc/skel/lopora "$HOME/lopora"
          cd "$HOME/lopora" && exec python3 LOPORA-v5g.py "$@"

    - name: Lopora desktop entry
      copy:
        dest: /usr/share/applications/lopora.desktop
        mode: "0644"
        content: |
          [Desktop Entry]
          Name=Lopora
          Comment=QRSS / slow-CW beacon reception and keyer (PA2OHH)
          Exec=lopora
          Terminal=true
          Type=Application
          Categories=HamRadio;
