#
# aa-analyzer — Perl controller/plotter for RigExpert AA-series antenna analyzers over USB
# serial. Arch-independent Perl; needs Device::SerialPort (apt) + a RigExpert AA to do real work.
#
- name: Install aa-analyzer
  hosts: hampi
  become: yes
  tags: aa_analyzer
  tasks:
    - name: Install dependencies
      apt:
        state: present
        name: [curl, perl, libdevice-serialport-perl]

    - name: Download + install aa-analyzer
      shell: |
        set -e
        mkdir -p /usr/local/src/aa-analyzer && cd /usr/local/src/aa-analyzer
        curl -fsSL -o aa-analyzer.tar.gz https://sourceforge.net/projects/aa-analyzer/files/latest/download
        tar xzf aa-analyzer.tar.gz
        pl=$(find . -name 'aa-analyzer.pl' | head -1)
        install -m 0755 "$pl" /usr/local/bin/aa-analyzer.pl
        ln -sf /usr/local/bin/aa-analyzer.pl /usr/local/bin/aa-analyzer
      args:
        creates: /usr/local/bin/aa-analyzer.pl
