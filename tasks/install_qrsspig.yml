#
# QrssPiG (HB9FXX) — QRSS grabber: captures a spectrogram from an SDR/soundcard and uploads it.
# Installed from the maintainer's own arm64 apt repo (debian.hb9fxx.ch), which has a Trixie suite.
#
- name: Install QrssPiG (QRSS grabber)
  hosts: hampi
  become: yes
  tags: qrsspig
  tasks:
    - name: Ensure keyring dir exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add HB9FXX repo signing key
      get_url:
        url: https://debian.hb9fxx.ch/debian/key.asc
        dest: /etc/apt/keyrings/hb9fxx.asc
        mode: "0644"

    - name: Add HB9FXX apt repo (Trixie)
      copy:
        dest: /etc/apt/sources.list.d/hb9fxx.list
        mode: "0644"
        content: "deb [signed-by=/etc/apt/keyrings/hb9fxx.asc] https://debian.hb9fxx.ch/debian/ trixie/\n"

    - name: Install qrsspig
      apt:
        name: qrsspig
        state: present
        update_cache: yes
