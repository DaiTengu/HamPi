#
# SDRangel (f4exb) — full-featured SDR rx/tx GUI. The original HamPi removed it (#-). Large Qt5
# CMake build; built against Trixie apt deps. The DV/DSD plugins (mbelib/dsdcc/serialdv) and a
# few extras auto-disable if their libs are absent — the core rx/tx + analog modes still build.
#
- name: Install SDRangel (removed as too-hard in original HamPi)
  hosts: hampi
  become: yes
  tags: sdrangel
  tasks:
    - name: Install build dependencies
      apt:
        state: present
        name:
          - git
          - cmake
          - g++
          - pkg-config
          - libfftw3-dev
          - libusb-1.0-0-dev
          - qtbase5-dev
          - qtchooser
          - qtmultimedia5-dev
          - libqt5websockets5-dev
          - qttools5-dev
          - qttools5-dev-tools
          - libqt5opengl5-dev
          - qtbase5-private-dev
          - libqt5svg5-dev
          - libboost-all-dev
          - libasound2-dev
          - libopencv-dev
          - libxml2-dev
          - bison
          - flex
          - libavcodec-dev
          - libavformat-dev
          - libopus-dev
          - libcodec2-dev
          - libairspy-dev
          - libairspyhf-dev
          - libhackrf-dev
          - librtlsdr-dev
          - liblimesuite-dev
          - libiio-dev
          - libad9361-dev
          - qtdeclarative5-dev
          - qtpositioning5-dev
          - qtlocation5-dev
          - libqt5charts5-dev
          - libqt5serialport5-dev
          - libqt5texttospeech5-dev
          - qtwebengine5-dev
          - libqt5gamepad5-dev
          - qtquickcontrols2-5-dev
          - libqt5sql5-sqlite
          - libsndfile1-dev
          - libunwind-dev

    - name: Clone SDRangel (f4exb)
      git:
        repo: https://github.com/f4exb/sdrangel.git
        dest: /usr/local/src/sdrangel
        depth: 1

    - name: Build + install SDRangel (long build)
      shell: |
        set -e
        cd /usr/local/src/sdrangel
        rm -rf build && mkdir build && cd build
        cmake -Wno-dev -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local ..
        make -j"$(nproc)"
        make install
        ldconfig
      args:
        creates: /usr/local/bin/sdrangel
