# SoapyPlutoSDR (pothosware) — SoapySDR driver for the ADALM-PLUTO. Original removed it as
# "Build broken under Bookworm"; builds clean against Trixie's libiio + libad9361.
#
- name: Install SoapyPlutoSDR module (removed as too-hard in original HamPi)
  hosts: hampi
  become: yes
  tags: soapy_plutosdr
  tasks:
    - name: Install build dependencies
      apt:
        state: present
        name: [git, cmake, g++, pkg-config, libsoapysdr-dev, libiio-dev, libad9361-dev]

    - name: Clone SoapyPlutoSDR
      git:
        repo: https://github.com/pothosware/SoapyPlutoSDR.git
        dest: /usr/local/src/SoapyPlutoSDR
        depth: 1

    - name: Build + install SoapyPlutoSDR
      shell: |
        set -e
        cd /usr/local/src/SoapyPlutoSDR
        rm -rf build && mkdir build && cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..
        make -j"$(nproc)"
        make install
        ldconfig
        touch /usr/local/src/SoapyPlutoSDR/.hampi-built
      args:
        creates: /usr/local/src/SoapyPlutoSDR/.hampi-built
