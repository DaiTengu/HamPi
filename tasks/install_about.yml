#
# "About HamPi" menu entry + branding icons (Pi-only, unconditional).
# NOTE: the about_hampi script + HamPi.desktop are inherited from W3DJS's HamPi;
# content (version/credits) can be updated for the DaiTengu fork later.
#
- name: About HamPi menu entry
  hosts: hampi
  become: yes
  gather_facts: no
  tags: about
  tasks:
    - name: Install zenity (the About dialog uses it)
      apt:
        name: zenity
        state: present

    - name: Create hampi icon directories
      file:
        path: "/usr/share/icons/hampi/{{ item }}"
        state: directory
        mode: "0755"
      loop: ["256x256", "128x128", "64x64", "48x48", "32x32"]

    - name: Install HamPi icon (top-level)
      copy:
        src: "{{ playbook_dir }}/../files/usr/share/icons/hampi.png"
        dest: /usr/share/icons/hampi.png
        mode: "0644"

    - name: Install HamPi icon (per resolution)
      copy:
        src: "{{ playbook_dir }}/../files/usr/share/icons/hampi/hampi.png"
        dest: "/usr/share/icons/hampi/{{ item }}/hampi.png"
        mode: "0644"
      loop: ["256x256", "128x128", "64x64", "48x48", "32x32"]

    - name: Install HamPi pixmap
      copy:
        src: "{{ playbook_dir }}/../files/usr/share/pixmaps/hampi.png"
        dest: /usr/share/pixmaps/hampi.png
        mode: "0644"

    - name: Install "About HamPi" desktop entry
      copy:
        src: "{{ playbook_dir }}/../files/usr/share/applications/HamPi.desktop"
        dest: /usr/share/applications/HamPi.desktop
        mode: "0644"

    - name: Install about_hampi script
      copy:
        src: "{{ playbook_dir }}/../files/usr/bin/about_hampi"
        dest: /usr/bin/about_hampi
        mode: "0755"
