#
# F4HTBPanadapter — standalone panadapter/PNA. The original HamPi removed it as "Build broken
# under Bookworm"; that note is stale. It builds on Trixie/aarch64 after downgrading GCC 14's
# narrowing/permissive errors (one Makefile sed), against system FFTW + ALSA.
#
- name: Install F4HTBPanadapter (removed as too-hard in original HamPi)
  hosts: hampi
  become: yes
  tags: f4htbpna
  tasks:
    - name: Install build dependencies
      apt:
        state: present
        name: [git, build-essential, libfftw3-dev, libasound2-dev]

    - name: Clone F4HTBPanadapter
      git:
        repo: https://github.com/F4HTB/F4HTBPanadapter.git
        dest: /usr/local/src/F4HTBPanadapter
        depth: 1
        force: yes          # the build seds the Makefile in-tree; force keeps re-runs idempotent

    - name: Build + install F4HTBPanadapter (GCC 14 permissive/narrowing patch)
      shell: |
        set -e
        cd /usr/local/src/F4HTBPanadapter
        sed -i 's/-O0/-O0 -fpermissive -Wno-narrowing/' Makefile
        make
        bin=$(find . -maxdepth 2 -type f -executable ! -name '*.sh' ! -name '*.o' | head -1)
        install -m 0755 "$bin" /usr/local/bin/F4HTBPanadapter
      args:
        creates: /usr/local/bin/F4HTBPanadapter
