#
# HamPi desktop wallpaper → /usr/share/rpd-wallpaper (path unchanged on Trixie).
# Only the branded wallpaper committed to this fork is installed; the original
# referenced ~40 rig/ARRL photos that aren't in the repo. It shows up in the
# desktop wallpaper picker; the user selects it (setting a default under Wayland
# is a per-user action, not baked in).
#
- name: Install HamPi wallpaper
  hosts: hampi
  become: yes
  tags: wallpaper
  tasks:
    - name: Copy HamPi wallpaper to rpd-wallpaper
      copy:
        src: "{{ playbook_dir }}/../files/usr/share/wallpapers/HamPi Desktop Wallpaper.png"
        dest: "/usr/share/rpd-wallpaper/HamPi Desktop Wallpaper.png"
        mode: "0644"
