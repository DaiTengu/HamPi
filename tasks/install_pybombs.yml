#
# PyBOMBS (GNU Radio) — build/package manager for GNU Radio out-of-tree modules. Pure Python;
# installed system-wide from upstream git via pip.
#
- name: Install PyBOMBS
  hosts: hampi
  become: yes
  tags: pybombs
  tasks:
    - name: Install prerequisites
      apt:
        state: present
        name: [git, python3-pip]

    - name: Install PyBOMBS from git (system-wide)
      pip:
        name: git+https://github.com/gnuradio/pybombs.git
        extra_args: --break-system-packages
      register: pb
      retries: 2
      delay: 10
      until: pb is succeeded
