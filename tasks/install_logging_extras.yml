# HamPi64 (github.com/DaiTengu/HamPi) — 64-bit port of HamPi for Raspberry Pi OS Trixie / Pi 5.
# Original HamPi by Dave Slotter (W3DJS); this fork maintained by KD9QHQ. GPL-3.0.
#
# Additional logging apps (Trixie apt, arm64), on top of the core
# CQRlog / KLog / xlog installed in Milestone 1.
#
- name: Install additional logging apps
  hosts: hampi
  become: yes
  tags: logging_extras
  tasks:
    - name: apt-install extra logging apps
      apt:
        update_cache: yes
        state: present
        name:
          - tlf           # console contest logger
          - tucnak        # VHF/UHF/SHF contest logger
          - pyqso         # Python/GTK logbook (packaged in Trixie)
