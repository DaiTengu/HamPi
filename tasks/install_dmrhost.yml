#
# DMRHost (BrandMeister fork of MMDVMHost) — MMDVM digital-voice host daemon. Builds from source
# (needs MMDVM/hotspot hardware to actually run). CMake build.
#
- name: Install DMRHost
  hosts: hampi
  become: yes
  tags: dmrhost
  tasks:
    - name: Install build dependencies
      apt:
        state: present
        name: [git, cmake, g++, make]

    - name: Clone DMRHost (BrandMeister)
      git:
        repo: https://github.com/BrandMeister/DMRHost.git
        dest: /usr/local/src/DMRHost
        depth: 1

    - name: Build + install DMRHost
      shell: |
        set -e
        cd /usr/local/src/DMRHost
        rm -rf build && mkdir build && cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..
        make -j"$(nproc)"
        bin=$(find . -maxdepth 2 -type f -executable -iname 'DMRHost' | head -1)
        install -m 0755 "$bin" /usr/local/bin/DMRHost
      args:
        creates: /usr/local/bin/DMRHost
