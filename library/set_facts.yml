#
# HamPi64 target sanity check. The original multi-platform fact-setting (HamPC/HamIQ, and the
# Buster/Bullseye/Bookworm/Impish/Jammy branches) is gone — HamPi64 targets only 64-bit
# Raspberry Pi OS "Trixie" on the Raspberry Pi 5. This play fails fast, before anything is
# installed, if the playbook is pointed at the wrong target.
#
- name: HamPi64 target sanity check
  hosts: hampi
  gather_facts: yes
  tasks:
    - name: Require 64-bit ARM (aarch64 — Raspberry Pi 5)
      assert:
        that: ansible_architecture == "aarch64"
        fail_msg: "HamPi64 targets 64-bit ARM (aarch64); this host is {{ ansible_architecture }}."

    - name: Require Raspberry Pi OS "Trixie" (Debian 13)
      assert:
        that:
          - ansible_distribution == "Debian"
          - ansible_distribution_release == "trixie"
        fail_msg: >-
          HamPi64 targets Raspberry Pi OS Trixie (Debian 13);
          this host is {{ ansible_distribution }} {{ ansible_distribution_release }}.
